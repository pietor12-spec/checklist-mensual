<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checklist</title>
<meta name="description" content="Tu checklist mensual de inversiones">
<meta name="theme-color" content="#F3F4F1" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest?v=6">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){var t='auto';try{t=localStorage.getItem('cl-theme')||'auto'}catch(e){}
var d=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;
document.documentElement.setAttribute('data-theme',d);})();
</script>
<style>
:root{
  --bg:#F3F4F1;--card:#FFFFFF;--card2:#F7F8F5;--ink:#141614;--mute:#6E736D;--faint:#A3A8A1;
  --line:#ECEEEA;--acc:#13A866;--acc2:#0B6B5C;--accSoft:#E2F4E9;--accInk:#FFFFFF;
  --warn:#C77700;--warnSoft:#FDF0DC;--shadow:0 1px 2px rgba(20,22,20,.04),0 8px 24px -12px rgba(20,22,20,.12);
  --r:20px;--serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0D0F0E;--card:#171A19;--card2:#131615;--ink:#F0F2EE;--mute:#8F958E;--faint:#5C625B;
  --line:#232725;--acc:#33CF7F;--acc2:#1FA67A;--accSoft:#16271D;--accInk:#06120B;
  --warn:#F2A93B;--warnSoft:#2A2113;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;transition:background .35s,color .35s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .4s ease,visibility .4s}
#splash.hide{opacity:0;visibility:hidden}
#splash .mark{width:104px;height:104px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash .mark .ck{stroke-dasharray:1;stroke-dashoffset:1}
#splash .mark .bx{fill-opacity:0}
#splash .mark .ln{opacity:.35}
#splash .mark .bx0{animation:fillb .2s .85s forwards}#splash .mark .ck0{animation:draw .3s .85s cubic-bezier(.6,0,.2,1) forwards}#splash .mark .ln0{animation:lit .3s .85s forwards}
#splash .mark .bx1{animation:fillb .2s 1.6s forwards}#splash .mark .ck1{animation:draw .3s 1.6s cubic-bezier(.6,0,.2,1) forwards}#splash .mark .ln1{animation:lit .3s 1.6s forwards}
#splash .mark .bx2{animation:fillb .2s 2.3s forwards}#splash .mark .ck2{animation:draw .3s 2.3s cubic-bezier(.6,0,.2,1) forwards}#splash .mark .ln2{animation:lit .3s 2.3s forwards}
@keyframes lit{to{opacity:1}}@keyframes fillb{to{fill-opacity:1}}
#splash .word{font-family:var(--serif);font-size:46px;letter-spacing:-.5px;line-height:1;opacity:0;transform:translateY(8px);animation:up .7s .55s ease forwards}
#splash .bar{width:148px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;opacity:0;animation:fade .3s .2s forwards}
#splash .bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:3px;animation:load 2.4s .2s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes load{to{transform:scaleX(1)}}

/* ---------- Layout ---------- */
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;align-items:center;gap:10px;height:52px}
header .logo{width:30px;height:30px;flex:none}
header .brand{font-family:var(--serif);font-size:27px;letter-spacing:-.3px;flex:1}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink);transition:background .2s,transform .15s}
.icon-btn:active{transform:scale(.92);background:var(--line)}
.icon-btn svg{width:22px;height:22px}
.sun{display:none}:root[data-theme="dark"] .sun{display:block}:root[data-theme="dark"] .moon{display:none}

/* KPI */
.kpi{margin-top:12px;border-radius:30px;padding:28px 24px;background:linear-gradient(135deg,#0B6B5C,#22C47A);color:#fff;display:flex;align-items:center;gap:22px;box-shadow:0 18px 36px -16px rgba(11,107,92,.65);position:relative;overflow:hidden}
:root[data-theme="dark"] .kpi{background:linear-gradient(135deg,#0B5E51,#1E9F66);box-shadow:0 18px 36px -18px rgba(0,0,0,.8)}
.kpi:after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.22)}
.ring .val{stroke:#fff;transition:stroke-dashoffset .8s cubic-bezier(.3,.9,.3,1)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring b small{font-size:17px;font-weight:600;opacity:.8;margin-left:1px}
.kpi h1{margin:0;font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.6px;position:relative}

/* secciones */
.section{margin-top:28px}
.sec-head{display:flex;align-items:center;gap:9px;margin:0 6px 11px}
.sec-date{font-size:18px;font-weight:700;letter-spacing:-.3px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accSoft);color:var(--acc);white-space:nowrap}
.chip.now{background:var(--acc);color:var(--accInk)}
.chip.late{background:var(--warnSoft);color:var(--warn)}
.card{background:transparent}

.item{position:relative;background:var(--card);border-radius:var(--r);margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:flex-start;gap:14px;padding:16px;min-height:62px;width:100%;text-align:left;user-select:none;border-radius:var(--r);transition:background .15s}
.row:active{background:var(--card2)}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;margin-top:-1px;position:relative;transition:border-color .2s,background .25s,transform .2s}
.box svg{width:15px;height:15px;stroke:var(--accInk);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .05s ease;position:relative;z-index:1}
.done>.row .box{background:var(--acc);border-color:var(--acc);animation:bump .35s ease}
.done>.row .box svg{stroke-dashoffset:0}
.box.partial{border-color:transparent;background:conic-gradient(var(--acc) calc(var(--p)*360deg),var(--line) 0)}
.box.partial:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card)}
@keyframes bump{40%{transform:scale(1.18)}}
.txt{flex:1;min-width:0;padding-top:2px}
.t{font-size:16px;font-weight:500;line-height:1.3;transition:color .25s}
.n{font-size:13.5px;color:var(--mute);line-height:1.4;margin-top:3px}
.done>.row .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint);text-decoration-thickness:1.5px}
.done>.row .n{color:var(--faint)}
.right{display:flex;align-items:center;gap:8px;padding-top:1px}
.pill{font-size:12.5px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.done .pill{color:var(--acc)}
.chev{width:20px;height:20px;color:var(--mute);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.open>.row .chev{transform:rotate(180deg)}
.subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.3,.9,.3,1)}
.open>.subs{grid-template-rows:1fr}
.subs>div{overflow:hidden}
.subs .inner{margin:0 14px 12px 28px;border-left:2px solid var(--line);padding-left:4px}
.sub{background:none;box-shadow:none;margin:0}
.sub .row{padding:11px 10px;min-height:50px;border-radius:14px}
.sub .box{width:22px;height:22px}
.sub .box svg{width:12px;height:12px}
.sub .t{font-size:15px}
.sub .t i{font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums;margin-right:6px;font-size:13px;font-weight:600}

/* edit mode */
.editbar{display:none;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 0;padding:12px 14px;border-radius:16px;background:var(--accSoft);color:var(--acc);font-size:14px;font-weight:600}
.editing .editbar{display:flex}.icon-btn.on{background:var(--accSoft);color:var(--acc)}
.editbar button{background:var(--acc);color:var(--accInk);padding:8px 14px;border-radius:12px;font-weight:600}
.item .erow{border-radius:var(--r)}.erow{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 16px}
.erow .fields{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.erow input{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 11px;font-size:15px;outline:none}
.erow input.note{font-size:13.5px;color:var(--mute)}
.erow input:focus{border-color:var(--acc)}
.del{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute);flex:none}
.del:active{background:var(--warnSoft);color:var(--warn)}
.del svg{width:18px;height:18px}
.add{display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;color:var(--acc);font-weight:600;font-size:14.5px;border:1.5px dashed color-mix(in srgb,var(--acc) 45%,transparent);border-radius:var(--r);margin-bottom:9px}.esubs .add{border:0;margin:0}
.add svg{width:18px;height:18px}
.esubs{margin:0 12px 10px 24px;border-left:2px solid var(--line)}
.esubs .erow{padding:8px 4px 8px 12px}

footer{text-align:center;color:var(--faint);font-size:12.5px;margin-top:34px;line-height:1.6}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;visibility:hidden;transition:.3s;z-index:40;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .38s cubic-bezier(.3,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none}.scrim.on{opacity:1;visibility:visible}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:4px 6px 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);transition:.2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border-radius:14px;font-size:16px;font-weight:500;text-align:left}
.mi:active{background:var(--card2)}
.mi svg{width:22px;height:22px;color:var(--mute);flex:none}
.mi small{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-top:2px}
.mi.danger{color:var(--warn)}.mi.danger svg{color:var(--warn)}
.hint{display:none;margin:4px 8px 8px;padding:12px 14px;border-radius:14px;background:var(--card2);font-size:14px;color:var(--mute);line-height:1.5}
.hint.on{display:block}

/* celebrate */
#party{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:.35s}
#party.on{opacity:1;visibility:visible}
#party .box2{text-align:center;max-width:340px;transform:scale(.9);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
#party.on .box2{transform:none}
#party .medal{width:116px;height:116px;border-radius:28px;margin:0 auto 18px;filter:drop-shadow(0 18px 30px rgba(17,154,94,.35))}
#party h2{font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.05;margin:0 0 10px}
#party p{color:var(--mute);margin:0 0 24px;line-height:1.5;font-size:15.5px}
.cta{display:block;width:100%;background:var(--ink);color:var(--bg);padding:15px 28px;border-radius:16px;font-weight:600;font-size:16px}.cta2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px 28px;border-radius:16px;font-weight:600;font-size:16px;color:var(--acc);background:var(--accSoft)}.cta2 svg{width:19px;height:19px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:61}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,calc(100% + 60px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:70;display:flex;gap:14px;align-items:center;transition:transform .35s cubic-bezier(.3,.9,.3,1);max-width:calc(100% - 32px);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast button{color:var(--acc);font-weight:700}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash" aria-hidden="true">
  <svg class="mark" viewBox="0 0 512 512"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B6B5C"/><stop offset="1" stop-color="#22C47A"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#sg)"/><rect class="bx bx0" x="128" y="140" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect class="ln ln0" x="224" y="155" width="160" height="26" rx="13" fill="#fff"/><path class="ck ck0" pathLength="1" d="M143 169l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect class="bx bx1" x="128" y="228" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect class="ln ln1" x="224" y="243" width="128" height="26" rx="13" fill="#fff"/><path class="ck ck1" pathLength="1" d="M143 257l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect class="bx bx2" x="128" y="316" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect class="ln ln2" x="224" y="331" width="148" height="26" rx="13" fill="#fff"/><path class="ck ck2" pathLength="1" d="M143 345l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="word">Checklist</div>
  <div class="bar"><i></i></div>
</div>

<div class="wrap" id="app">
  <header>
    <svg class="logo" viewBox="0 0 512 512"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B6B5C"/><stop offset="1" stop-color="#22C47A"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#lg)"/><rect x="128" y="140" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect x="224" y="155" width="160" height="26" rx="13" fill="#fff"/><path d="M143 169l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect x="128" y="228" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect x="224" y="243" width="128" height="26" rx="13" fill="#fff"/><path d="M143 257l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect x="128" y="316" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect x="224" y="331" width="148" height="26" rx="13" fill="#fff"/><path d="M143 345l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="brand">Checklist</div>
    <button class="icon-btn" id="editBtn" aria-label="Editar tareas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="menuBtn" aria-label="Menú">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <section class="kpi">
    <div class="ring">
      <svg viewBox="0 0 100 100">
        <circle class="trk" cx="50" cy="50" r="42" fill="none" stroke-width="9"/>
        <circle class="val" id="ringVal" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
      </svg>
      <b id="pct">0<small>%</small></b>
    </div>
    <h1>Checklist Mensual</h1>
  </section>

  <div class="editbar"><span>Modo edición</span><button id="doneEdit">Listo</button></div>
  <div id="list"></div>

  <footer id="foot"></footer>
</div>

<!-- Menu sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Menú">
  <div class="grab"></div>
  <h3>Apariencia</h3>
  <div class="seg" id="seg"><button data-t="auto">Auto</button><button data-t="light">Claro</button><button data-t="dark">Oscuro</button></div>
  <button class="mi" id="miInstall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Instalar app<small>Añádela a tu pantalla de inicio</small></span></button>
  <div class="hint" id="iosHint">En iPhone: pulsa <b>Compartir</b> en Safari y elige <b>Añadir a pantalla de inicio</b>.</div>
  <button class="mi" id="miEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg><span>Editar tareas<small>Renombrar, añadir o quitar</small></span></button>
  <button class="mi" id="miExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span>Exportar copia<small>Para pasar tus datos a otro dispositivo</small></span></button>
  <button class="mi" id="miImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span>Importar copia</span></button>
  <button class="mi" id="miNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="miNewTxt">Empezar nuevo mes</span></button>
  <button class="mi danger" id="miReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg><span>Desmarcar todo<small>Empezar el ciclo de cero</small></span></button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>

<!-- Celebration -->
<div id="party" role="dialog" aria-label="Todo completado">
  <div class="box2">
    <svg class="medal" viewBox="0 0 512 512"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B6B5C"/><stop offset="1" stop-color="#22C47A"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#pg)"/><rect x="128" y="140" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect x="224" y="155" width="160" height="26" rx="13" fill="#fff"/><path d="M143 169l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect x="128" y="228" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect x="224" y="243" width="128" height="26" rx="13" fill="#fff"/><path d="M143 257l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect x="128" y="316" width="56" height="56" rx="16" fill="#fff" stroke="#fff" stroke-width="12"/><rect x="224" y="331" width="148" height="26" rx="13" fill="#fff"/><path d="M143 345l11 11 21-24" fill="none" stroke="#0F8A63" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>¡Todo hecho!</h2>
    <p id="partyMsg"></p>
    <button class="cta" id="partyOk">Genial</button>
    <button class="cta2" id="partyNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="partyNewTxt">Nuevo mes</span></button>
  </div>
</div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn" hidden>Deshacer</button></div>

<script>
const KEY='checklist-app-v2', TKEY='cl-theme';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

const DEFAULT_SECTIONS=[
 {id:'s30',day:'Día 30',title:'Cierre de mes',kind:30,tasks:[
  {id:'t1',text:'Actualizar Checklist Dashboard Personal',subs:[
   {id:'d1',text:'Pestaña Alertas',note:'Comprobar que se han pasado bien los datos'},
   {id:'d2',text:'Pestaña Dividendos',note:'Que estén todos y coincidan con la app de dividendos'},
   {id:'d3',text:'Pestaña Fondos',note:'Mirar MyInvestor, volcar los datos de las tres carteras y actualizar la tabla comparativa'},
   {id:'d4',text:'Pestaña Inmuebles',note:'Revisar si ha finalizado algún proyecto'},
   {id:'d5',text:'Pestaña Crypto',note:'Actualizar precio'},
   {id:'d6',text:'Pestaña Ahorros',note:'Revisar intereses, saveback y staking; editar el fondo de emergencia'},
   {id:'d7',text:'Pestaña Resumen',note:'Gráfico de distribución por plataforma (solo Trade Republic): valor actual menos beneficio o pérdidas'},
   {id:'d8',text:'Pestaña Comparativa',note:'Gráfico de evolución: último mes en Trade Republic y KPI de rentabilidad de la pestaña Resumen'},
   {id:'d9',text:'Pestaña Libertad Financiera',note:'Actualizar el KPI principal'},
   {id:'d10',text:'Pestaña Alertas · zona de venta',note:'Ver si alguna ha llegado a zona de venta, revisar su gráfico y, si es así, vender'}
  ]},
  {id:'t2a',text:'Excel Compras Mensuales',note:'Precio actual…'},
  {id:'t2b',text:'Excel Investing',note:'Con todos los datos'},
  {id:'t3',text:'Actualizar Dashboard compras mensuales'},
  {id:'t4',text:'Elegir compras mensuales',note:'Revisando el Dashboard de compras y los gráficos en TradingView'},
  {id:'t5',text:'Programar las compras en Trade Republic'}
 ]},
 {id:'s2',day:'Día 2–3',title:'Inicio de mes',kind:2,tasks:[
  {id:'t6',text:'Descargar las compras',note:'Mandarlas a la carpeta Organizador de documentos y activar el organizador en Claude'},
  {id:'t7',text:'App Div Tracker',note:'Actualizar las empresas que he comprado'},
  {id:'t8',text:'App Alquileres',note:'Actualizar los alquileres'}
 ]}
];

let S=load();
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!Array.isArray(s.sections))s={sections:JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),done:{},open:{},cycle:null,history:[]};
  s.done=s.done||{};s.open=s.open||{};s.history=s.history||[];
  s.sections.forEach(sec=>{const i=sec.tasks.findIndex(t=>t.id==='t2'&&/2 Excel/.test(t.text));
    if(i>-1){const was=!!s.done.t2;sec.tasks.splice(i,1,{id:'t2a',text:'Excel Compras Mensuales',note:'Precio actual…'},{id:'t2b',text:'Excel Investing',note:'Con todos los datos'});if(was){s.done.t2a=s.done.t2b=true}delete s.done.t2}});
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

/* ---------- Ciclo mensual: del día 25 al 24 del mes siguiente ---------- */
function cycleOf(d){let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<25){m--;if(m<0){m=11;y--}}return{y,m,id:y+'-'+String(m+1).padStart(2,'0')}}
function cycleName(id){const[y,m]=id.split('-');return MESES[+m-1]}
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function dueDates(c){
  const last=new Date(c.y,c.m+1,0).getDate();
  const d30=new Date(c.y,c.m,Math.min(30,last));
  const d2=new Date(c.y,c.m+1,2), d3=new Date(c.y,c.m+1,3);
  return{30:[d30,d30],2:[d2,d3]};
}
const parseC=id=>{const[y,m]=id.split('-').map(Number);return{y,m:m-1,id}};
const nextC=id=>{let{y,m}=parseC(id);m++;if(m>11){m=0;y++}return{y,m,id:y+'-'+String(m+1).padStart(2,'0')}};
function checkCycle(){
  const c=cycleOf(new Date());
  if(S.cycle&&S.cycle>c.id)return parseC(S.cycle);
  if(S.cycle&&S.cycle!==c.id){
    const p=progress();
    S.history.push({cycle:S.cycle,pct:p.pct});
    S.done={};
    toast('Nuevo ciclo de '+cycleName(c.id)+'. Checklist lista de nuevo');
  }
  S.cycle=c.id;save();return c;
}
function newMonth(){
  const p=progress();S.history.push({cycle:S.cycle,pct:p.pct});
  const n=nextC(S.cycle);S.cycle=n.id;S.done={};S.open={};save();cyc=n;lastPct=null;render();
  window.scrollTo({top:0,behavior:'smooth'});toast('Checklist de '+cycleName(n.id)+' lista');
}

/* ---------- Progreso ---------- */
const leaves=t=>t.subs&&t.subs.length?t.subs:[t];
const isDone=t=>leaves(t).every(l=>S.done[l.id]);
function progress(sec){
  const secs=sec?[sec]:S.sections;let steps=0,stepsDone=0,tasks=0,tasksDone=0;
  secs.forEach(s=>s.tasks.forEach(t=>{tasks++;if(isDone(t))tasksDone++;leaves(t).forEach(l=>{steps++;if(S.done[l.id])stepsDone++})}));
  return{steps,stepsDone,tasks,tasksDone,pct:steps?Math.round(stepsDone/steps*100):0};
}

/* ---------- Render ---------- */
const ICON_CHECK='<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const ICON_CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_DEL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_ADD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
let editing=false, cyc;

function render(){
  const L=$('list');let h='';
  S.sections.forEach(s=>{
    h+=`<div class="section" data-sec="${s.id}"><div class="sec-head"><span class="sec-date" data-date="${s.id}">${esc(s.day)}</span><span class="chip" data-chip="${s.id}"></span></div><div class="card">`;
    s.tasks.forEach(t=>{
      const hasSubs=t.subs&&t.subs.length;
      if(editing){
        h+=`<div class="item"><div class="erow"><div class="fields"><input data-f="text" data-id="${t.id}" value="${esc(t.text)}" placeholder="Tarea"><input class="note" data-f="note" data-id="${t.id}" value="${esc(t.note||'')}" placeholder="Detalle (opcional)"></div><button class="del" data-del="${t.id}" aria-label="Eliminar">${ICON_DEL}</button></div>`;
        if(hasSubs){h+='<div class="esubs">';t.subs.forEach((u,i)=>{h+=`<div class="erow"><div class="fields"><input data-f="text" data-id="${u.id}" value="${esc(u.text)}" placeholder="Paso"><input class="note" data-f="note" data-id="${u.id}" value="${esc(u.note||'')}" placeholder="Detalle (opcional)"></div><button class="del" data-del="${u.id}" aria-label="Eliminar">${ICON_DEL}</button></div>`});h+=`<button class="add" data-addsub="${t.id}">${ICON_ADD}Añadir paso</button></div>`}
        h+='</div>';
      }else{
        h+=`<div class="item${S.open[t.id]?' open':''}" data-item="${t.id}">
          <div class="row" data-tap="${t.id}">
            <button class="box" data-check="${t.id}" aria-label="Marcar">${ICON_CHECK}</button>
            <div class="txt"><div class="t">${esc(t.text)}</div>${t.note?`<div class="n">${esc(t.note)}</div>`:''}</div>
            ${hasSubs?`<div class="right"><span class="pill" data-pill="${t.id}"></span>${ICON_CHEV}</div>`:''}
          </div>`;
        if(hasSubs){
          h+='<div class="subs"><div><div class="inner">';
          t.subs.forEach((u,i)=>{h+=`<div class="item sub" data-item="${u.id}"><div class="row" data-tap="${u.id}"><span class="box" aria-hidden="true">${ICON_CHECK}</span><div class="txt"><div class="t"><i>${String(i+1).padStart(2,'0')}</i>${esc(u.text)}</div>${u.note?`<div class="n">${esc(u.note)}</div>`:''}</div></div></div>`});
          h+='</div></div></div>';
        }
        h+='</div>';
      }
    });
    if(editing)h+=`<button class="add" data-addtask="${s.id}">${ICON_ADD}Añadir tarea</button>`;
    h+='</div></div>';
  });
  L.innerHTML=h;
  document.body.classList.toggle('editing',editing);
  update(true);
}

function find(id){for(const s of S.sections)for(const t of s.tasks){if(t.id===id)return{s,t,parent:null};if(t.subs)for(const u of t.subs)if(u.id===id)return{s,t:u,parent:t}}return null}

let lastPct=null;
function update(silent){
  // rows
  S.sections.forEach(s=>s.tasks.forEach(t=>{
    const el=document.querySelector(`[data-item="${t.id}"]`);if(!el)return;
    const done=isDone(t);el.classList.toggle('done',done);
    if(t.subs&&t.subs.length){
      const n=t.subs.filter(u=>S.done[u.id]).length;
      const box=el.querySelector(':scope>.row .box');
      box.classList.toggle('partial',n>0&&!done);box.style.setProperty('--p',n/t.subs.length);
      el.querySelector('[data-pill]').textContent=n+'/'+t.subs.length;
      t.subs.forEach(u=>{const e=document.querySelector(`[data-item="${u.id}"]`);e&&e.classList.toggle('done',!!S.done[u.id])});
    }
  }));
  // fechas y avisos
  const dd=dueDates(cyc),now=today();
  S.sections.forEach(s=>{
    const chip=document.querySelector(`[data-chip="${s.id}"]`);if(!chip)return;
    const p=progress(s);const[a,b]=dd[s.kind]||[null,null];
    const lab=document.querySelector(`[data-date="${s.id}"]`);
    if(lab&&a)lab.textContent=DIAS_L[a.getDay()]+' '+a.getDate()+(s.kind===2?'–'+b.getDate():'')+' '+MESES[a.getMonth()].slice(0,3);
    chip.className='chip';chip.style.display='';
    if(p.tasks&&p.tasksDone===p.tasks){chip.textContent='Hecho';return}
    if(!a){chip.style.display='none';return}
    const diff=Math.round((a-now)/864e5),diffB=Math.round((b-now)/864e5);
    if(diff<=0&&diffB>=0){chip.textContent='Hoy';chip.classList.add('now')}
    else if(diffB<0){chip.textContent='Pendiente';chip.classList.add('late')}
    else if(diff===1)chip.textContent='Mañana';
    else chip.textContent='en '+diff+' días';
  });
  const P=progress();
  $('ringVal').style.strokeDashoffset=263.9*(1-P.pct/100);
  $('pct').innerHTML=P.pct+'<small>%</small>';
  const full=S.history.filter(h=>h.pct===100).length;
  $('foot').innerHTML=(full?`${full} ${full===1?'mes completado':'meses completados'} · `:'')+'Checklist de '+cycleName(cyc.id)+' · se guarda automáticamente';
  $('partyNewTxt').textContent='Nuevo mes · '+cap(cycleName(nextC(cyc.id).id));
  $('miNewTxt').textContent='Empezar '+cycleName(nextC(cyc.id).id);
  if(!silent&&lastPct!==null&&lastPct<100&&P.pct===100)celebrate();
  lastPct=P.pct;
}
function fmt(d){return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3)}

/* ---------- Interacción ---------- */
$('list').addEventListener('click',e=>{
  const chk=e.target.closest('[data-check]');
  if(chk){e.stopPropagation();toggle(chk.dataset.check);return}
  const tap=e.target.closest('[data-tap]');
  if(tap){
    const f=find(tap.dataset.tap);
    if(f&&f.t.subs&&f.t.subs.length){S.open[f.t.id]=!S.open[f.t.id];tap.parentElement.classList.toggle('open',S.open[f.t.id]);save();buzz();return}
    toggle(tap.dataset.tap);return;
  }
  const del=e.target.closest('[data-del]');if(del){remove(del.dataset.del);return}
  const at=e.target.closest('[data-addtask]');if(at){snapshot();const s=S.sections.find(x=>x.id===at.dataset.addtask);const id=uid();s.tasks.push({id,text:''});save();render();focus(id);return}
  const as=e.target.closest('[data-addsub]');if(as){snapshot();const f=find(as.dataset.addsub);const id=uid();f.t.subs.push({id,text:''});save();render();focus(id);return}
});
$('list').addEventListener('input',e=>{const i=e.target.closest('input[data-id]');if(!i)return;const f=find(i.dataset.id);if(f){f.t[i.dataset.f]=i.value;save()}});
function focus(id){const i=document.querySelector(`input[data-id="${id}"][data-f="text"]`);i&&i.focus()}
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function toggle(id){
  const f=find(id);if(!f)return;
  if(f.t.subs&&f.t.subs.length){const all=isDone(f.t);f.t.subs.forEach(u=>{if(all)delete S.done[u.id];else S.done[u.id]=true})}
  else{if(S.done[id])delete S.done[id];else S.done[id]=true}
  buzz();save();update();
}

let undoSnap=null;
function snapshot(){undoSnap=JSON.stringify(S.sections)}
function remove(id){
  snapshot();
  for(const s of S.sections){
    const i=s.tasks.findIndex(t=>t.id===id);if(i>-1){s.tasks.splice(i,1);break}
    for(const t of s.tasks)if(t.subs){const j=t.subs.findIndex(u=>u.id===id);if(j>-1){t.subs.splice(j,1);break}}
  }
  save();render();toast('Eliminada',()=>{S.sections=JSON.parse(undoSnap);save();render()});
}

/* ---------- Tema ---------- */
function themePref(){try{return localStorage.getItem(TKEY)||'auto'}catch(e){return'auto'}}
function applyTheme(){
  const t=themePref();const d=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;
  document.documentElement.setAttribute('data-theme',d);
  $('themeColor').setAttribute('content',d==='dark'?'#0D0F0E':'#F3F4F1');
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}
function setTheme(t){try{localStorage.setItem(TKEY,t)}catch(e){}applyTheme()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
$('themeBtn').onclick=()=>{buzz();setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')};
$('seg').onclick=e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)};

/* ---------- Menú ---------- */
const openSheet=()=>{$('sheet').classList.add('on');$('scrim').classList.add('on')};
const closeSheet=()=>{$('sheet').classList.remove('on');$('scrim').classList.remove('on')};
$('menuBtn').onclick=()=>{buzz();openSheet()};$('scrim').onclick=closeSheet;
$('miEdit').onclick=()=>{closeSheet();startEdit()};
function startEdit(){editing=true;render();$('editBtn').classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}
$('editBtn').onclick=()=>{buzz();editing?$('doneEdit').click():startEdit()};
$('doneEdit').onclick=()=>{
  // limpiar vacías
  S.sections.forEach(s=>{s.tasks=s.tasks.filter(t=>t.text.trim()||(t.subs&&t.subs.length));s.tasks.forEach(t=>{if(t.subs)t.subs=t.subs.filter(u=>u.text.trim())})});
  editing=false;$('editBtn').classList.remove('on');save();render();toast('Cambios guardados');
};
$('miReset').onclick=()=>{closeSheet();const prev=JSON.stringify(S.done);S.done={};save();update(true);toast('Checklist desmarcada',()=>{S.done=JSON.parse(prev);save();update(true)})};
$('miExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='checklist-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);closeSheet();toast('Copia exportada');
};
$('miImport').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.sections))throw 0;S=Object.assign({done:{},open:{},history:[]},d);cyc=checkCycle();save();render();closeSheet();toast('Copia importada')}
  catch(err){toast('Ese archivo no es una copia válida')}
  e.target.value='';
};

/* Instalar */
let deferred=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
if(standalone)$('miInstall').style.display='none';
$('miInstall').onclick=async()=>{
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;closeSheet();if(r.outcome==='accepted')toast('Instalando…');return}
  const H=$('iosHint');H.classList.add('on');
  H.innerHTML=isIOS
    ?'<b>iPhone:</b> abre este enlace en <b>Safari</b>, pulsa <b>Compartir</b> y elige <b>Añadir a pantalla de inicio</b>.'
    :'<b>1.</b> Ábrela en <b>Google Chrome</b> (no en el navegador de Xiaomi ni dentro de otra app).<br><b>2.</b> Menú <b>⋮</b> arriba a la derecha → <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.<br><b>3.</b> En Xiaomi/Redmi/POCO, si no aparece el icono: Ajustes → Aplicaciones → Chrome → Permisos → activa <b>Accesos directos en pantalla de inicio</b> y repite.';
};
addEventListener('appinstalled',()=>{$('miInstall').style.display='none';toast('App instalada')});

/* ---------- Toast ---------- */
let tt;
function toast(msg,undo){
  $('toastTxt').textContent=msg;const b=$('toastBtn');b.hidden=!undo;b.onclick=()=>{undo&&undo();$('toast').classList.remove('on')};
  $('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),undo?4500:2600);
}

/* ---------- Celebración ---------- */
const MSGS=['Has cerrado el ciclo de {m}. Cartera al día, cabeza tranquila.','Ciclo de {m} completado. Tu yo del futuro te lo agradece.','Todo listo en {m}. Disciplina que se convierte en interés compuesto.'];
function celebrate(){
  $('partyMsg').textContent=MSGS[Math.floor(Math.random()*MSGS.length)].replace('{m}',cycleName(cyc.id));
  $('party').classList.add('on');try{navigator.vibrate&&navigator.vibrate([20,60,30])}catch(e){}confetti();
}
$('partyOk').onclick=()=>$('party').classList.remove('on');
$('partyNew').onclick=()=>{$('party').classList.remove('on');newMonth()};
$('miNew').onclick=()=>{closeSheet();if(confirm('¿Empezar la checklist de '+cycleName(nextC(cyc.id).id)+'? Se desmarcará todo.'))newMonth()};
function confetti(){
  const c=$('confetti'),x=c.getContext('2d'),dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cols=['#22C47A','#0B6B5C','#F5C451','#7BE0A8','#ffffff','#119A5E'];
  const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35,s:Math.random()<.5}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1000;x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-k/3);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.s)x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{x.beginPath();x.arc(0,0,p.r/2.4,0,7);x.fill()}x.restore()});
    if(k<3.2)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0);
}

function greet(){const h=new Date().getHours();return(h<6?'Buenas noches':h<14?'Buenos días':h<21?'Buenas tardes':'Buenas noches')+', Sergio'}
